# CI for SmartLinks (Nuxt 4 + Nitro; one process serves the landing, the in-portal pages and
# /api/*). Runs the full check gate (lint + typecheck + test) + build so a regression can't
# reach main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch. Pushing a follow-up commit to a PR cancels the run for the commit it
# replaced — that run can only report on code nobody will merge, and it holds a runner while a
# `pnpm build` (the slow step) finishes for nothing. `main` is excluded from cancellation by the
# group key including the ref, so a merge run is never killed by the next merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Served build (Nitro node-server) — the primary deploy path (Black Hole).
      - run: pnpm build
